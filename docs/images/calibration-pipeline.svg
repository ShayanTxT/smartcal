<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" width="1100" height="340">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="340" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Header -->
  <text x="40" y="44" fill="#F8FAFC" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700">
    SmartCal Calibration &amp; Linux Input Pipeline
  </text>
  <text x="40" y="68" fill="#94A3B8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
    Hardware-agnostic evdev / udev capture → Robust Homography + RANSAC / TPS → Multi-monitor X11 &amp; Wayland
  </text>

  <!-- Step 1: Hardware Input -->
  <rect x="40" y="96" width="225" height="205" rx="12" fill="#0B1220" stroke="#3B82F6" stroke-width="1.6"/>
  <rect x="40" y="96" width="225" height="34" rx="12" fill="#1D4ED8"/>
  <text x="152" y="118" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">1. Raw Linux Input</text>
  <text x="58" y="156" fill="#E2E8F0" font-family="monospace" font-size="12">/dev/input/event*</text>
  <text x="58" y="178" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• evdev + udev hot-plug</text>
  <text x="58" y="200" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Single-Touch slot lock</text>
  <text x="58" y="222" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Median + MAD outlier filter</text>
  <text x="58" y="244" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Moving average smoothing</text>
  <rect x="58" y="262" width="189" height="24" rx="6" fill="#1E293B" stroke="#22C55E" stroke-width="1"/>
  <text x="152" y="278" text-anchor="middle" fill="#4ADE80" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">Non-root udev permissions</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="268" y1="198" x2="296" y2="198" stroke="#38BDF8" stroke-width="2.5"/>
  <polygon points="296,192 308,198 296,204" fill="#38BDF8"/>

  <!-- Step 2: Math Engine -->
  <rect x="310" y="96" width="245" height="205" rx="12" fill="#0B1220" stroke="#38BDF8" stroke-width="1.6"/>
  <rect x="310" y="96" width="245" height="34" rx="12" fill="#0284C7"/>
  <text x="432" y="118" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">2. Calibration Math</text>
  <text x="328" y="156" fill="#E2E8F0" font-family="monospace" font-size="12">H * [x_raw, y_raw, 1]^T</text>
  <text x="328" y="178" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• 4-pt Normalized DLT + LM</text>
  <text x="328" y="200" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• 9/16/25-pt RANSAC Homography</text>
  <text x="328" y="222" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Poly Deg 2/3 &amp; Hybrid TPS</text>
  <text x="328" y="244" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Keystone &amp; rotation fix</text>
  <rect x="328" y="262" width="209" height="24" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
  <text x="432" y="278" text-anchor="middle" fill="#7DD3FC" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">Sub-pixel error evaluation</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="558" y1="198" x2="586" y2="198" stroke="#38BDF8" stroke-width="2.5"/>
  <polygon points="586,192 598,198 586,204" fill="#38BDF8"/>

  <!-- Step 3: Accuracy Vector Map Preview -->
  <rect x="600" y="96" width="225" height="205" rx="12" fill="#0B1220" stroke="#22C55E" stroke-width="1.6"/>
  <rect x="600" y="96" width="225" height="34" rx="12" fill="#15803D"/>
  <text x="712" y="118" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">3. Accuracy Vector Map</text>

  <!-- Mini grid inside Step 3 -->
  <rect x="620" y="144" width="185" height="106" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
  <line x1="681" y1="144" x2="681" y2="250" stroke="#1E293B" stroke-width="1"/>
  <line x1="743" y1="144" x2="743" y2="250" stroke="#1E293B" stroke-width="1"/>
  <line x1="620" y1="179" x2="805" y2="179" stroke="#1E293B" stroke-width="1"/>
  <line x1="620" y1="215" x2="805" y2="215" stroke="#1E293B" stroke-width="1"/>
  <!-- 9 target nodes + tiny magnified residual vectors -->
  <circle cx="642" cy="162" r="5" fill="none" stroke="#22C55E" stroke-width="1.5"/>
  <line x1="642" y1="162" x2="646" y2="164" stroke="#22C55E" stroke-width="2"/>
  <circle cx="712" cy="162" r="5" fill="none" stroke="#22C55E" stroke-width="1.5"/>
  <line x1="712" y1="162" x2="714" y2="160" stroke="#22C55E" stroke-width="2"/>
  <circle cx="782" cy="162" r="5" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
  <line x1="782" y1="162" x2="774" y2="167" stroke="#F59E0B" stroke-width="2"/>

  <circle cx="642" cy="197" r="5" fill="none" stroke="#22C55E" stroke-width="1.5"/>
  <circle cx="712" cy="197" r="5" fill="none" stroke="#22C55E" stroke-width="1.5"/>
  <circle cx="782" cy="197" r="5" fill="none" stroke="#22C55E" stroke-width="1.5"/>

  <circle cx="642" cy="233" r="5" fill="none" stroke="#22C55E" stroke-width="1.5"/>
  <circle cx="712" cy="233" r="5" fill="none" stroke="#22C55E" stroke-width="1.5"/>
  <circle cx="782" cy="233" r="5" fill="none" stroke="#22C55E" stroke-width="1.5"/>

  <rect x="620" y="262" width="185" height="24" rx="6" fill="#1E293B" stroke="#22C55E" stroke-width="1"/>
  <text x="712" y="278" text-anchor="middle" fill="#4ADE80" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">Avg: 1.8 px  |  Quality: Excellent</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="828" y1="198" x2="856" y2="198" stroke="#38BDF8" stroke-width="2.5"/>
  <polygon points="856,192 868,198 856,204" fill="#38BDF8"/>

  <!-- Step 4: Display Server Apply -->
  <rect x="870" y="96" width="190" height="205" rx="12" fill="#0B1220" stroke="#A855F7" stroke-width="1.6"/>
  <rect x="870" y="96" width="190" height="34" rx="12" fill="#7E22CE"/>
  <text x="965" y="118" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">4. Apply &amp; Persist</text>
  <text x="886" y="156" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">X11 (x11rb)</text>
  <text x="886" y="174" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11.5">• Multi-monitor CTM</text>
  <text x="886" y="198" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Wayland</text>
  <text x="886" y="216" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11.5">• swaymsg / udev rule</text>
  <text x="886" y="234" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11.5">• uinput daemon mode</text>
  <rect x="886" y="262" width="158" height="24" rx="6" fill="#1E293B" stroke="#A855F7" stroke-width="1"/>
  <text x="965" y="278" text-anchor="middle" fill="#D8B4FE" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">Auto-backup &amp; startup</text>
</svg>
