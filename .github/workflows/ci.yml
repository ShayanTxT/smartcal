name: SmartCal Linux CI & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop & input dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config curl file \
            xinput x11-xserver-utils libinput-tools udev \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            fonts-dejavu-core

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run workspace unit & integration tests
        run: cargo test --workspace --locked || cargo test --workspace

      - name: Build release binary
        run: cargo build --release --bin smartcal

      - name: Smoke-test CLI flags
        run: |
          ./target/release/smartcal --help
          ./target/release/smartcal --list-displays
          ./target/release/smartcal --list-devices
          ./target/release/smartcal --diagnostics --export calibration-diagnostics.txt

      - name: Determine release version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Debian (.deb) package
        run: |
          chmod +x packaging/*.sh install.sh uninstall.sh
          VERSION="${{ steps.ver.outputs.version }}" ./packaging/build-deb.sh
          dpkg-deb --info dist/smartcal_*_amd64.deb

      - name: Build AppImage (.AppImage)
        run: |
          curl -fsSL -o /tmp/appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool.AppImage
          (cd /tmp && /tmp/appimagetool.AppImage --appimage-extract >/dev/null)
          VERSION="${{ steps.ver.outputs.version }}" \
            APPIMAGETOOL_BIN="/tmp/squashfs-root/AppRun" \
            ./packaging/build-appimage.sh

      - name: Build portable Linux tarball (.tar.gz)
        run: |
          VER="${{ steps.ver.outputs.version }}"
          BUNDLE="dist/smartcal-${VER}-linux-x86_64"
          mkdir -p "${BUNDLE}/packaging/desktop" "${BUNDLE}/packaging/icons" "${BUNDLE}/packaging/udev"
          cp target/release/smartcal "${BUNDLE}/smartcal"
          cp packaging/install-release.sh "${BUNDLE}/install-release.sh"
          cp uninstall.sh "${BUNDLE}/uninstall.sh"
          cp packaging/desktop/smartcal.desktop "${BUNDLE}/packaging/desktop/"
          cp packaging/icons/smartcal.svg "${BUNDLE}/packaging/icons/"
          cp packaging/udev/99-smartcal-permissions.rules "${BUNDLE}/packaging/udev/"
          cp README.md README.fa.md LICENSE-MIT LICENSE-APACHE "${BUNDLE}/"
          chmod +x "${BUNDLE}/smartcal" "${BUNDLE}/install-release.sh" "${BUNDLE}/uninstall.sh"
          tar -C dist -czf "dist/smartcal-${VER}-linux-x86_64.tar.gz" "smartcal-${VER}-linux-x86_64"
          rm -rf "${BUNDLE}"
          ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smartcal-linux-packages
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.gz

      - name: Publish GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.gz
